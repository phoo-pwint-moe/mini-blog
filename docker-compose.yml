services:
  backend:
    build:
      context: ./blog-backend
    container_name: blog-backend
    ports:
      - "4000:4000"
    volumes:
      - ./blog-backend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development

  frontend:
    build:
      context: ./blog-frontend
    container_name: blog-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./blog-frontend:/app
      - /app/node_modules

